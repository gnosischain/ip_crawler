services:
  # Continuous loop: one window run every SLEEP_INTERVAL seconds.
  ip-crawler:
    build: .
    restart: always
    env_file:
      - .env
    environment:
      - CRAWLER_MODE=continuous
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import os; exit(0 if os.path.exists('/app/logs/health.log') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # One nebula window run, then exit (what the Kubernetes CronJob does).
  ip-crawler-once:
    build: .
    env_file:
      - .env
    environment:
      - CRAWLER_MODE=once
    volumes:
      - ./logs:/app/logs
    restart: "no"

  # Print the work list only: no ipinfo calls, no inserts, no migrations.
  ip-crawler-dry-run:
    build: .
    env_file:
      - .env
    environment:
      - CRAWLER_MODE=dry-run
      - DRY_RUN=true
    volumes:
      - ./logs:/app/logs
    restart: "no"

  # Enrich one named IP source (see IP_SOURCE_QUERIES in src/config.py) and exit.
  # Keyed on IP_SOURCE, not CRAWLER_MODE: CRAWLER_MODE=once is the nebula job.
  ip-crawler-source:
    build: .
    env_file:
      - .env
    environment:
      - IP_SOURCE=${IP_SOURCE:-hopr}
    volumes:
      - ./logs:/app/logs
    restart: "no"
