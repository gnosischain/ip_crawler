services:
  ip-crawler:
    build: .
    restart: always
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import os; exit(0 if os.path.exists('/app/logs/health.log') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  ip-crawler-once:
    build: .
    env_file:
      - .env
    environment:
      - CRAWLER_MODE=once
    volumes:
      - ./logs:/app/logs
    restart: "no"
  # Enrich one named IP source (see IP_SOURCE_QUERIES in src/config.py) and exit.
  # Note it sets IP_SOURCE and NOT CRAWLER_MODE: CRAWLER_MODE=once would run a batch
  # of the nebula crawl instead, silently enriching no HOPR IPs. No healthcheck --
  # this is a short-lived job, not a service.
  ip-crawler-source:
    build: .
    env_file:
      - .env
    environment:
      - IP_SOURCE=${IP_SOURCE:-hopr}
    volumes:
      - ./logs:/app/logs
    restart: "no" 